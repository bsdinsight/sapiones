# Sapiones — VPS stack (PostgreSQL + Odoo 19 + Cloudflare Tunnel)
#
# Trên VPS:
#   git clone https://github.com/bsdinsight/sapiones /root/sapiones && cd /root/sapiones
#   cp deploy/.env.example .env                      # điền POSTGRES_PASSWORD + TUNNEL_TOKEN
#   cp deploy/odoo.conf.example deploy/odoo.conf     # đổi admin_passwd mạnh
#   chmod 644 deploy/odoo.conf                        # BẮT BUỘC: container user 'odoo' phải đọc được (Linux native)
#   docker compose -f docker-compose.vps.yml up -d db odoo            # khởi tạo (chưa expose)
#   docker compose -f docker-compose.vps.yml exec -T odoo \
#     bash -lc 'odoo -d sapiones -i l10n_vn_hr --db_host=$HOST --db_user=$USER --db_password=$PASSWORD --stop-after-init --no-http'
#   docker compose -f docker-compose.vps.yml --profile tunnel up -d   # bật Cloudflare Tunnel
name: sapiones

services:
  db:
    image: postgres:16
    container_name: sapiones-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 6

  odoo:
    image: odoo:19
    container_name: sapiones-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - web-data:/var/lib/odoo
      - ./deploy/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./:/mnt/extra-addons:ro
      # Module thương mại (repo private bsdinsight/sapiones-enterprise) — clone sibling cùng cấp /root/.
      # Self-hoster chỉ dùng phần Community có thể bỏ dòng này.
      - ../sapiones-enterprise:/mnt/enterprise-addons:ro
    # Không expose host port — cloudflared (cùng network) truy cập odoo:8069

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sapiones-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]               # chỉ chạy khi: --profile tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - odoo

volumes:
  db-data:
  web-data:
